version: 0.2

phases:
  build:
    commands:
      - echo "Wysylam polecenie wdrozenia przez AWS Systems Manager..."
      - >
        COMMAND_ID=$(aws ssm send-command
        --targets "Key=tag:Name,Values=moj-projekt-website"
        --document-name "AWS-RunShellScript"
        --comment "Deploy z CodePipeline/CodeBuild"
        --parameters commands='["cd /home/ubuntu/moj-projekt-website","sudo git pull","sudo rsync -a --exclude buildspec.yml --exclude .git /home/ubuntu/moj-projekt-website/ /var/www/html/","sudo systemctl restart nginx"]'
        --query "Command.CommandId"
        --output text)
      - echo "Command ID $COMMAND_ID"
      - sleep 8
      - |
        STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].Status" --output text)
        echo "Status wdrozenia: $STATUS"
        if [ "$STATUS" != "Success" ]; then
          echo "Wdrozenie nie powiodlo sie, output:"
          aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
          exit 1
        fi
